    <link rel="stylesheet" href="style.css">

    <style>
       .fiche-recette {
    width: 100%;
    max-width: 1500px;
    margin: 50px auto;
    padding: 30px;
    box-sizing: border-box;
}

        .retour {
            display: inline-block;
            margin-bottom: 25px;
            color: #967844;
            text-decoration: none;
        }

        .recette-photo {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
        }

        .recette-titre {
            font-size: clamp(30px, 5vw, 48px);
            margin: 25px 0 15px;
        }

        .recette-infos {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px 0;
        }

        .recette-infos span {
            padding: 12px 18px;
            background: #f7f5f0;
            border-radius: 8px;
        }

.recette-contenu {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(400px, 2fr) minmax(250px, 1fr);
    gap: 25px;
    margin-top: 40px;
    width: 100%;
}

        .recette-contenu h2 {
            border-bottom: 2px solid #b59458;
            padding-bottom: 12px;
        }

        .recette-contenu li {
            margin-bottom: 15px;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .fiche-recette {
                padding: 20px;
                margin: 20px auto;
            }

            .recette-contenu {
                grid-template-columns: 1fr;
            }
        }
        /* ==========================================
   DESIGN DES INGRÉDIENTS
========================================== */

.recette-contenu ul {
    list-style: none;
    padding: 0;
    margin: 20px 0;
}

.recette-contenu ul li {
    background: #ffffff;
    border: 1px solid #e8e2d8;
    border-left: 4px solid #b59458;
    border-radius: 8px;
    padding: 15px 18px;
    margin-bottom: 12px;
    font-size: 16px;
}

/* ==========================================
   DESIGN DES ÉTAPES DE PRÉPARATION
========================================== */

.recette-contenu ol {
    list-style: none;
    padding: 0;
    margin: 20px 0;
    counter-reset: etape;
}

.recette-contenu ol li {
    counter-increment: etape;
    position: relative;
    background: #ffffff;
    border: 1px solid #e8e2d8;
    border-radius: 10px;
    padding: 20px 20px 20px 70px;
    margin-bottom: 18px;
    line-height: 1.7;
}

.recette-contenu ol li::before {
    content: counter(etape);
    position: absolute;
    left: 18px;
    top: 18px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #b59458;
    color: white;
    border-radius: 50%;
    font-weight: bold;
}

/* ==========================================
   TITRES DES SECTIONS
========================================== */

.recette-contenu h2 {
    font-size: 26px;
    color: #242424;
    margin-bottom: 25px;
    border-bottom: 2px solid #b59458;
    padding-bottom: 15px;
}

/* ==========================================
   ADAPTATION MOBILE
========================================== */

@media (max-width: 700px) {
    .recette-contenu {
        grid-template-columns: 1fr;
        gap: 25px;
    }

    .recette-contenu ol li {
        padding: 18px 15px 18px 65px;
    }

    .recette-contenu h2 {
        font-size: 23px;
    }
}
    </style>
</head>

<body>

    <header class="top">

    <main class="fiche-recette">

        <a href="index.html#recettes" class="retour">
            ← Retour aux recettes
        </a>

        <div id="recetteDetail">
            <p>Chargement de la recette...</p>
        </div>

    </main>

    <footer>
        © <span id="year"></span> Le Geste du Chef
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="calcul-prix.js"></script>
    <script src="recette.js"></script>

</body>
</html>
