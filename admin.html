<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Le Geste du Chef</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f0;
            color: #242424;
        }

        header {
            background: #171717;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            color: #d5b878;
        }

        .container {
            max-width: 450px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #b59458;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #967844;
        }

        #message {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #967844;
        }
    </style>
</head>

<body>

<header>
    <h1>LE GESTE DU CHEF</h1>
    <p>Espace administration</p>
</header>

<div class="container">

    <h2>Connexion administrateur</h2>

    <form id="loginForm">

        <label for="email">Adresse e-mail</label>
        <input
            type="email"
            id="email"
            placeholder="Votre adresse e-mail"
            autocomplete="email"
            required
        >

        <label for="password">Mot de passe</label>
        <input
            type="password"
            id="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Se connecter
        </button>

    </form>

    <p id="message"></p>

    <p style="text-align:center">
        <a href="index.html">← Retour au site</a>
    </p>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
