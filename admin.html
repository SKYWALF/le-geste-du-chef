<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Le Geste du Chef</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f0;
            color: #242424;
        }

        header {
            background: #171717;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            color: #d5b878;
        }

        .container {
            max-width: 450px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #b59458;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #967844;
        }

        #message {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #967844;
        }
    </style>
</head>

<body>

<header>
    <h1>LE GESTE DU CHEF</h1>
    <p>Espace administration</p>
</header>

<div class="container">

    <h2>Connexion administrateur</h2>

    <form id="loginForm">

        <label for="email">Adresse e-mail</label>
        <input
            type="email"
            id="email"
            placeholder="Votre adresse e-mail"
            autocomplete="email"
            required
        >

        <label for="password">Mot de passe</label>
        <input
            type="password"
            id="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Se connecter
        </button>

    </form>

    <p id="message"></p>

    <p style="text-align:center">
        <a href="index.html">← Retour au site</a>
    </p>
    </div>
<section id="dashboard" style="display:none; max-width:900px; margin:40px auto; padding:30px; background:white; border-radius:12px;">

    <h2>Tableau de bord administrateur</h2>

    <p>Bienvenue dans ton espace de gestion des recettes.</p>

    <hr>

    <h3>🍽️ Gestion des recettes</h3>

    <button type="button" id="ajouterRecette">
        + Ajouter une recette
    </button>
    <div id="formulaireRecette" style="display:none; margin-top:30px;">

    <h3 id="titreFormulaire">Nouvelle recette</h3>

    <form id="recetteForm">

        <label for="titreRecette">Nom de la recette</label>
        <input type="text" id="titreRecette" required>

        <label for="categorieRecette">Catégorie</label>
        <select id="categorieRecette" required>
            <option value="">Choisir une catégorie</option>
            <option value="Entrée">Entrée</option>
            <option value="Plat">Plat</option>
            <option value="Dessert">Dessert</option>
        </select>

        <label for="descriptionRecette">Description</label>
        <textarea id="descriptionRecette" rows="4"></textarea>

        <label for="preparationRecette">Temps de préparation (minutes)</label>
        <input type="number" id="preparationRecette" min="0" value="0">

        <label for="cuissonRecette">Temps de cuisson (minutes)</label>
        <input type="number" id="cuissonRecette" min="0" value="0">

        <label for="portionsRecette">Nombre de portions</label>
        <input type="number" id="portionsRecette" min="1" value="4">

        <label for="ingredientsRecette">Ingrédients (un par ligne)</label>
        <textarea
            id="ingredientsRecette"
            rows="6"
            placeholder="500 g de farine&#10;10 g de sel&#10;300 ml d'eau"
        ></textarea>

        <label for="etapesRecette">Étapes de préparation (une par ligne)</label>
        <textarea
            id="etapesRecette"
            rows="8"
            placeholder="Préchauffer le four&#10;Mélanger les ingrédients&#10;Enfourner"
        ></textarea>

        <label for="imageRecette">Adresse de la photo (URL)</label>
        <input
            type="url"
            id="imageRecette"
            placeholder="https://exemple.fr/photo.jpg"
        >

        <label style="margin-bottom:20px;">
            <input type="checkbox" id="publieRecette" style="width:auto;">
            Publier immédiatement
        </label>

        <button type="submit">Enregistrer la recette</button>

    </form>

    <p id="messageRecette"></p>

</div>

    <div id="listeRecettes">
        <p>Tes recettes apparaîtront ici.</p>
    </div>

    <hr>

    <button type="button" id="deconnexion">
        Se déconnecter
    </button>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
